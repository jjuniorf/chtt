<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12141c">
<title>Chat Only</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12141c; --surface: #1b1f2b; --line: #2a2f3f;
    --text: #e8e6df; --muted: #8a8fa3; --accent: #ffb454;
    --size: 17px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; overflow: hidden; }

  header { display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    background: var(--surface); border-bottom: 1px solid var(--line); }
  #dot { width: 22px; height: 22px; flex: none; display: flex; color: var(--muted); }
  #dot svg { width: 100%; height: 100%; fill: currentColor; }
  #dot.wait { color: var(--accent); }
  #dot.live.twitch { color: #9146ff; }
  #dot.live.kick { color: #53fc18; }
  #title { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; overflow: hidden; }
  #chname { font-weight: 800; font-size: 18px; line-height: 1.2; white-space: nowrap; }
  #stats { display: flex; align-items: center; gap: 12px; line-height: 1.2; font-size: 16px; color: var(--muted); white-space: nowrap;
    font-variant-numeric: tabular-nums; overflow: hidden; }
  #stats .v { color: var(--text); font-weight: 600; }
  #stats .viewers { display: inline-flex; align-items: center; gap: 5px; color: #ff4d4d; font-weight: 700; }
  #stats .viewers svg { width: 18px; height: 18px; flex: none; }
  #gear { display: flex; align-items: center; justify-content: center; padding: 8px 10px; }
  button { font: inherit; color: var(--text); background: transparent; border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 12px; min-height: 40px; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #panel { display: none; padding: 14px; background: var(--surface); border-bottom: 1px solid var(--line); gap: 14px; flex-direction: column; }
  #panel.open { display: flex; }
  #panel label { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 15px; }
  #panel input[type=text] { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 12px; width: 150px; }
  #panel input[type=range] { width: 150px; accent-color: var(--accent); }
  #panel input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--accent); }
  #plat { display: flex; gap: 8px; }
  #plat button { flex: 1; }
  #plat button.on { background: var(--accent); border-color: var(--accent); color: #1a1205; font-weight: 800; }
  #kickwrap { display: none; flex: 1; min-height: 0; position: relative; overflow: hidden; }
  body.kick #kickwrap { display: block; }
  #kickframe { position: absolute; top: 0; left: 0; width: 100%; height: calc(100% + var(--kcrop, 0px));
    border: 0; background: var(--bg); }
  #panel label#croprow { display: none; }
  body.kick #panel label#croprow { display: flex; }
  body.kick #feed, body.kick #jump { display: none; }
  #stats .kicktag { color: #53fc18; font-weight: 700; }

  #feed { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 8px 14px 14px; -webkit-overflow-scrolling: touch; }
  .msg { font-size: var(--size); line-height: 1.4; padding: 5px 0; overflow-wrap: anywhere; }
  .msg .name { font-weight: 800; }
  .msg .badges img { height: 1.1em; margin: -.15em 3px 0 0; border-radius: 3px; vertical-align: middle; }
  .msg .badges .sword { display: inline-block; width: 1.15em; height: 1.15em; margin: -.15em 3px 0 0;
    vertical-align: middle; color: #4ade80; }
  .msg .colon { color: var(--muted); }
  .msg.action .body { font-style: italic; }
  .msg.sys { color: var(--muted); font-size: 14px; }

  .chip { font-size: .72em; font-weight: 600; background: #5eead4; color: #062a26; border-radius: 6px;
    padding: 1px 6px; margin-right: 6px; vertical-align: middle; }
  .msg.first { background: rgba(94,234,212,.10); box-shadow: inset 3px 0 0 #5eead4;
    margin: 2px -6px; padding: 5px 6px 5px 10px; border-radius: 6px; }
  .msg.mention { background: rgba(255,180,84,.16); box-shadow: inset 3px 0 0 var(--accent);
    margin: 2px -6px; padding: 5px 6px 5px 10px; border-radius: 6px; }

  .msg.alert { margin: 8px -6px; padding: 10px 12px; border-radius: 10px; background: var(--surface);
    border: 1px solid var(--line); border-left-width: 4px; }
  .msg.alert.sub { border-left-color: var(--accent); }
  .msg.alert.gift { border-left-color: #f472b6; }
  .msg.alert.raid { border-left-color: #7dd3fc; }
  .alert-text { font-weight: 800; }
  .alert-msg { margin-top: 4px; }
  .msg img { height: 1.7em; vertical-align: middle; margin: -.2em 1px; }

  #jump { position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: none;
    background: var(--accent); color: #1a1205; border: 0; font-weight: 800; padding: 10px 18px; border-radius: 999px; }
  #jump.show { display: block; }
  #empty { color: var(--muted); padding: 30px 6px; text-align: center; }
</style>
</head>
<body>
<header>
  <span id="dot" class="wait"></span>
  <div id="title"><span id="chname">chat</span><span id="stats"></span></div>
  <button id="gear" aria-label="Settings" aria-expanded="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
</header>

<section id="panel">
  <div id="plat" role="group" aria-label="Platform"><button data-p="twitch">Twitch</button><button data-p="kick">Kick</button></div>
  <label><span id="chanlabel">Channel</span> <input id="chan" type="text" autocapitalize="off" autocomplete="off" spellcheck="false"></label>
  <label>Text size <input id="size" type="range" min="13" max="30" step="1"></label>
  <label id="croprow">Hide Kick message box <input id="crop" type="range" min="0" max="250" step="5"></label>
  <label>Hide !commands <input id="nocmd" type="checkbox"></label>
  <button id="apply">Apply</button>
  <button id="disc">Disconnect</button>
</section>

<main id="feed"><div id="empty">Connecting to chat…</div></main>
<div id="kickwrap"><iframe id="kickframe" title="Kick chat"></iframe></div>
<button id="jump">New messages ↓</button>

<script>
(function () {
  var DEFAULT_CHANNEL = "djkyii";
  var MAX_MSGS = 200;
  var feed = document.getElementById("feed");
  var dot = document.getElementById("dot");
  var chnameEl = document.getElementById("chname");
  var statsEl = document.getElementById("stats");
  var jump = document.getElementById("jump");
  var panel = document.getElementById("panel");
  var chanInput = document.getElementById("chan");
  var sizeInput = document.getElementById("size");
  var nocmd = document.getElementById("nocmd");
  var discBtn = document.getElementById("disc");
  var applyBtn = document.getElementById("apply");
  var chanLabel = document.getElementById("chanlabel");
  var kickFrame = document.getElementById("kickframe");
  var cropInput = document.getElementById("crop");
  var platBtns = Array.prototype.slice.call(document.querySelectorAll("#plat button"));

  var channel = DEFAULT_CHANNEL, ws = null, retry = 0, retryTimer = null, stuck = true, manualOff = false;
  var platform = "twitch", pendingPlat = "twitch", twitchName = DEFAULT_CHANNEL, kickName = "";

  // ---- settings (storage can fail, so every access is guarded) ----
  function load(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  twitchName = load("channel", DEFAULT_CHANNEL);
  kickName = load("kickname", "");
  platform = pendingPlat = load("platform", "twitch") === "kick" ? "kick" : "twitch";
  channel = platform === "kick" ? kickName : twitchName;
  sizeInput.value = load("size", "17");
  nocmd.checked = load("nocmd", "0") === "1";
  refreshPanel();
  document.documentElement.style.setProperty("--size", sizeInput.value + "px");

  sizeInput.oninput = function () {
    document.documentElement.style.setProperty("--size", sizeInput.value + "px");
    save("size", sizeInput.value);
  };
  nocmd.onchange = function () { save("nocmd", nocmd.checked ? "1" : "0"); };

  // Kick's chat window is another site, so we can't edit it; instead the frame is made taller than its
  // box and the bottom (where the message input sits) is clipped off.
  cropInput.value = load("crop", "110");
  function applyCrop() {
    document.documentElement.style.setProperty("--kcrop", cropInput.value + "px");
    save("crop", cropInput.value);
  }
  cropInput.oninput = applyCrop;
  document.documentElement.style.setProperty("--kcrop", cropInput.value + "px");
  discBtn.onclick = function () {
    if (!manualOff) {
      manualOff = true;
      clearTimeout(retryTimer);
      if (ws) { ws.onclose = null; try { ws.close(); } catch (e) {} }
      kickFrame.removeAttribute("src");
      document.body.classList.remove("kick");
      setStatus("off");
      addSys("Disconnected. Open the menu and tap Reconnect to resume.");
      discBtn.textContent = "Reconnect";
    } else {
      connect();
    }
    panel.classList.remove("open");
    document.getElementById("gear").setAttribute("aria-expanded", "false");
  };
  document.getElementById("gear").onclick = function () {
    var open = panel.classList.toggle("open");
    this.setAttribute("aria-expanded", open);
  };
  function refreshPanel() {
    var kick = pendingPlat === "kick";
    platBtns.forEach(function (b) { b.classList.toggle("on", b.getAttribute("data-p") === pendingPlat); });
    chanLabel.textContent = kick ? "Kick username" : "Channel";
    chanInput.value = kick ? kickName : twitchName;
  }

  function applyError(msg) {
    applyBtn.textContent = msg;
    setTimeout(function () { applyBtn.textContent = "Apply"; }, 3000);
  }

  function applySettings() {
    var c = chanInput.value.trim().replace(/^[#@]/, "");
    if (pendingPlat === "kick") {
      if (!c) { applyError("Enter your Kick username"); return; }
      kickName = c;
      save("kickname", c);
      channel = c;
    } else {
      c = c.toLowerCase();
      if (!c) return;
      twitchName = c; save("channel", c);
      channel = c;
    }
    platform = pendingPlat; save("platform", platform);
    resetStats();
    feed.innerHTML = '<div id="empty">Connecting to chat…</div>';
    panel.classList.remove("open");
    document.getElementById("gear").setAttribute("aria-expanded", "false");
    connect();
  }

  platBtns.forEach(function (b) {
    b.onclick = function () {
      pendingPlat = b.getAttribute("data-p");
      refreshPanel();
      var ready = pendingPlat === "twitch" ? !!twitchName : !!kickName;
      if (pendingPlat !== platform && ready) applySettings();
    };
  });
  applyBtn.onclick = applySettings;

  // ---- scrolling ----
  function atBottom() { return feed.scrollHeight - feed.scrollTop - feed.clientHeight < 60; }
  function toBottom() { feed.scrollTop = feed.scrollHeight; stuck = true; jump.classList.remove("show"); }
  feed.addEventListener("scroll", function () {
    stuck = atBottom();
    if (stuck) jump.classList.remove("show");
  }, { passive: true });
  jump.onclick = toBottom;

  // ---- rendering ----
  function esc(s) { return s.replace(/[&<>"']/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  function renderBody(text, emotesTag) {
    var chars = Array.from(text);
    var spans = [];
    if (emotesTag) {
      emotesTag.split("/").forEach(function (grp) {
        var p = grp.split(":"); if (p.length < 2) return;
        p[1].split(",").forEach(function (r) {
          var se = r.split("-");
          spans.push({ id: p[0], s: +se[0], e: +se[1] });
        });
      });
      spans.sort(function (a, b) { return a.s - b.s; });
    }
    var out = "", i = 0;
    spans.forEach(function (sp) {
      if (sp.s < i) return;
      out += esc(chars.slice(i, sp.s).join(""));
      var url = "https://static-cdn.jtvnw.net/emoticons/v2/" + sp.id + "/default/dark/2.0";
      out += '<img src="' + url + '" alt="' + esc(chars.slice(sp.s, sp.e + 1).join("")) + '" loading="lazy">';
      i = sp.e + 1;
    });
    return out + esc(chars.slice(i).join(""));
  }

  // ---- badges (global + this channel's custom ones, fetched once) ----
  var badgeSets = { global: null, rooms: {} };

  function fetchJSON(url) {
    return fetch(url).then(function (r) { if (!r.ok) throw new Error("bad"); return r.json(); });
  }

  function loadGlobalBadges() {
    fetchJSON("https://badges.twitch.tv/v1/badges/global/display")
      .then(function (j) { badgeSets.global = j.badge_sets; refillBadges(); })
      .catch(function () {});
  }

  function loadRoomBadges(id) {
    if (!id || id in badgeSets.rooms) return;
    badgeSets.rooms[id] = null;
    fetchJSON("https://badges.twitch.tv/v1/badges/channels/" + encodeURIComponent(id) + "/display")
      .then(function (j) { badgeSets.rooms[id] = j.badge_sets; refillBadges(); })
      .catch(function () {});
  }

  function findBadge(set, ver, room) {
    var sources = [badgeSets.rooms[room], badgeSets.global];
    for (var i = 0; i < sources.length; i++) {
      var s = sources[i];
      if (s && s[set] && s[set].versions && s[set].versions[ver]) return s[set].versions[ver];
    }
    // exact version missing (e.g. a sub month with no custom art): use the set's first version
    for (var j = 0; j < sources.length; j++) {
      var t = sources[j];
      if (t && t[set] && t[set].versions) {
        var keys = Object.keys(t[set].versions);
        if (keys.length) return t[set].versions[keys[0]];
      }
    }
    return null;
  }

  var SWORD_ICON = '<svg class="sword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Moderator"><title>Moderator</title><polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/><line x1="13" x2="19" y1="19" y2="13"/><line x1="16" x2="20" y1="16" y2="20"/><line x1="19" x2="21" y1="21" y2="19"/></svg>';

  function fillBadges(el) {
    var raw = el.getAttribute("data-b");
    if (!raw) { el.setAttribute("data-done", "1"); return; }
    var room = el.getAttribute("data-room"), html = "", all = true;
    raw.split(",").forEach(function (b) {
      var p = b.split("/");
      if (p[0] === "moderator") { html += SWORD_ICON; return; }
      var v = findBadge(p[0], p[1], room);
      if (v) html += '<img src="' + esc(v.image_url_2x) + '" alt="' + esc(v.title || p[0]) + '" title="' + esc(v.title || p[0]) + '">';
      else all = false;
    });
    el.innerHTML = html;
    if (all && badgeSets.global && badgeSets.rooms[room]) el.setAttribute("data-done", "1");
  }

  function refillBadges() {
    var els = feed.querySelectorAll(".badges:not([data-done])");
    for (var i = 0; i < els.length; i++) fillBadges(els[i]);
  }

  // ---- mention matcher: your channel name plus any extra words from Settings ----
  var mentionRe = null;

  function buildMentionRe() {
    var list = [channel.toLowerCase()].filter(Boolean);
    mentionRe = list.length
      ? new RegExp("(^|[^a-z0-9_])@?(" + list.map(function (w) { return w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }).join("|") + ")(?![a-z0-9_])", "i")
      : null;
  }

  // ---- sub / gift / raid alerts (arrive as USERNOTICE lines) ----
  var ALERTS = {
    sub: "sub", resub: "sub",
    subgift: "gift", anonsubgift: "gift", submysterygift: "gift", anonsubmysterygift: "gift",
    giftpaidupgrade: "gift", anongiftpaidupgrade: "gift",
    raid: "raid"
  };

  function unescTag(s) {
    return (s || "").replace(/\\(s|:|r|n|\\)/g, function (m, c) {
      return c === "s" ? " " : c === ":" ? ";" : c === "\\" ? "\\" : " ";
    });
  }

  function handleNotice(tags, line) {
    var id = tags["msg-id"], kind = ALERTS[id];
    if (!kind) return;
    // single gifts from a gift bomb would flood the feed; the bomb banner already covers them
    if (id === "subgift" && tags["msg-param-community-gift-id"]) return;
    var m = line.match(/^:tmi\.twitch\.tv USERNOTICE #[^ ]+(?: :(.*))?$/);
    var userMsg = m && m[1] ? m[1] : "";
    var text = unescTag(tags["system-msg"]) || ("New " + id);
    var d = document.createElement("div");
    d.className = "msg alert " + kind;
    d.innerHTML = '<div class="alert-text">' + esc(text) + "</div>" +
      (userMsg ? '<div class="alert-msg">' + renderBody(userMsg, tags["emotes"]) + "</div>" : "");
    push(d);
  }

  function hashColor(name) {
    var h = 0; for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
    return "hsl(" + h + ",70%,70%)";
  }

  function addSys(text) {
    var d = document.createElement("div");
    d.className = "msg sys"; d.textContent = text;
    push(d);
  }

  function push(node) {
    var empty = document.getElementById("empty"); if (empty) empty.remove();
    feed.appendChild(node);
    while (feed.children.length > MAX_MSGS) feed.removeChild(feed.firstChild);
    if (stuck) toBottom(); else jump.classList.add("show");
  }

  function parseTags(raw) {
    var t = {};
    raw.slice(1).split(";").forEach(function (kv) {
      var i = kv.indexOf("="); t[kv.slice(0, i)] = kv.slice(i + 1);
    });
    return t;
  }

  function handleLine(line) {
    if (line.indexOf("PING") === 0) { ws.send("PONG :tmi.twitch.tv"); return; }
    var tags = {};
    if (line[0] === "@") {
      var sp = line.indexOf(" ");
      tags = parseTags(line.slice(0, sp));
      line = line.slice(sp + 1);
    }
    if (/^:tmi\.twitch\.tv USERNOTICE /.test(line)) { handleNotice(tags, line); return; }
    if (line.indexOf("PRIVMSG") === -1) {
      if (/ 366 /.test(line)) { setStatus("live"); addSys("Connected to #" + channel); }
      return;
    }
    var m = line.match(/^:([^!]+)![^ ]+ PRIVMSG #[^ ]+ :(.*)$/);
    if (!m) return;
    var text = m[2], action = false;
    if (text.indexOf("\u0001ACTION ") === 0) { action = true; text = text.replace(/^\u0001ACTION /, "").replace(/\u0001$/, ""); }
    if (nocmd.checked && text[0] === "!") return;

    var name = tags["display-name"] || m[1];
    var color = tags["color"] || hashColor(name);
    var room = tags["room-id"] || "";
    loadRoomBadges(room);

    var d = document.createElement("div");
    var first = tags["first-msg"] === "1";
    var mention = !!mentionRe && m[1].toLowerCase() !== channel && mentionRe.test(text);
    d.className = "msg" + (action ? " action" : "") + (first ? " first" : "") + (mention ? " mention" : "");
    d.innerHTML =
      (first ? '<span class="chip">first message</span>' : "") +
      '<span class="badges" data-b="' + esc(tags["badges"] || "") + '" data-room="' + esc(room) + '"></span>' +
      '<span class="name" style="color:' + esc(color) + '">' + esc(name) + "</span>" +
      (action ? " " : '<span class="colon">: </span>') +
      '<span class="body">' + renderBody(text, tags["emotes"]) + "</span>";
    fillBadges(d.firstChild);
    push(d);
  }

  // ---- connection (anonymous, read-only) ----
  var TWITCH_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.43l-3 3v-3H6.857V1.714h13.714Z"/></svg>';
  var KICK_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1.333 0h8v5.333H12V2.667h2.667V0h8v8H20v2.667h-2.667v2.666H20V16h2.667v8h-8v-2.667H12v-2.666H9.333V24h-8Z"/></svg>';

  function setStatus(s) {
    dot.className = (s === "live" ? "live " : s === "wait" ? "wait " : "") + platform;
    dot.innerHTML = platform === "kick" ? KICK_ICON : TWITCH_ICON;
    dot.title = s === "live" ? "Chat connected" : s === "wait" ? "Connecting" : "Disconnected";
    chnameEl.textContent = platform === "kick" ? (channel || "Kick") : "#" + channel;
  }

  // ---- stream stats: viewer count + time live (refreshed every 45s, clock ticks each second) ----
  var streamStart = null, viewers = 0, statsKnown = false, liveNoClock = false;

  function pad2(n) { return n < 10 ? "0" + n : "" + n; }

  function fmtUptime(ms) {
    var s = Math.max(0, Math.floor(ms / 1000));
    return Math.floor(s / 3600) + ":" + pad2(Math.floor(s % 3600 / 60)) + ":" + pad2(s % 60);
  }

  function fmtCount(n) {
    return n >= 10000 ? Math.round(n / 1000) + "K" : n >= 1000 ? (n / 1000).toFixed(1) + "K" : "" + n;
  }

  var PERSON_ICON = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="8" r="4.5"/><path d="M3.5 21c0-4.7 3.8-8 8.5-8s8.5 3.3 8.5 8z"/></svg>';

  function renderStats() {
    if (!statsKnown) { statsEl.innerHTML = platform === "kick" ? '<span class="kicktag">Kick</span>' : ""; return; }
    if (!streamStart && !liveNoClock) { statsEl.textContent = "offline"; return; }
    statsEl.innerHTML = '<span class="viewers" title="Viewers" aria-label="' + viewers + ' viewers">' + PERSON_ICON + fmtCount(viewers) + "</span>" +
      (streamStart ? '<span><span class="v">' + fmtUptime(Date.now() - streamStart) + "</span> live</span>" : "");
  }

  // Kick: unofficial public channel info. If Kick blocks this request the header just keeps the "Kick" tag.
  function fetchKickStats() {
    var ch = channel, slug = ch.toLowerCase().replace(/_/g, "-");
    fetch("https://kick.com/api/v2/channels/" + encodeURIComponent(slug), { headers: { Accept: "application/json" } })
      .then(function (r) { if (!r.ok) throw new Error("bad"); return r.json(); })
      .then(function (j) {
        if (platform !== "kick" || ch !== channel) return;
        var ls = j && j.livestream;
        streamStart = null; liveNoClock = false;
        if (ls) {
          var t = String(ls.start_time || ls.created_at || "");
          if (t && !/[zZ]$|[+-]\d\d:?\d\d$/.test(t)) t = t.replace(" ", "T") + "Z";
          var ms = Date.parse(t);
          if (isNaN(ms)) liveNoClock = true; else streamStart = ms;
          viewers = ls.viewer_count != null ? ls.viewer_count : (ls.viewers || 0);
        }
        statsKnown = true;
        renderStats();
      })
      .catch(function () {});
  }

  function fetchStats() {
    if (platform === "kick") { fetchKickStats(); return; }
    var ch = channel;
    fetch("https://gql.twitch.tv/gql", {
      method: "POST",
      headers: { "Client-ID": "kimne78kx3ncx6brgo4mv6wki5h1ko", "Content-Type": "application/json" },
      body: JSON.stringify({
        query: "query($l:String!){user(login:$l){stream{createdAt viewersCount}}}",
        variables: { l: ch }
      })
    })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (ch !== channel) return;
        var u = j && j.data && j.data.user;
        if (!u) return;
        if (u.stream) {
          streamStart = new Date(u.stream.createdAt).getTime();
          viewers = u.stream.viewersCount || 0;
        } else {
          streamStart = null;
        }
        statsKnown = true;
        renderStats();
      })
      .catch(function () {});
  }

  function resetStats() {
    streamStart = null; liveNoClock = false; statsKnown = false; renderStats(); fetchStats();
  }

  setInterval(renderStats, 1000);
  setInterval(fetchStats, 45000);

  function connect() {
    clearTimeout(retryTimer);
    manualOff = false;
    discBtn.textContent = "Disconnect";
    buildMentionRe();
    if (ws) { ws.onclose = null; try { ws.close(); } catch (e) {} }
    if (platform === "kick" && !channel) { platform = "twitch"; channel = twitchName; }
    if (platform === "kick") {
      // Kick doesn't allow outside pages to read its chat feed, so show Kick's own chat window
      document.body.classList.add("kick");
      kickFrame.src = "https://kick.com/popout/" + encodeURIComponent(channel) + "/chat";
      setStatus("live");
      return;
    }
    document.body.classList.remove("kick");
    kickFrame.removeAttribute("src");
    setStatus("wait");
    ws = new WebSocket("wss://irc-ws.chat.twitch.tv:443");
    ws.onopen = function () {
      retry = 0;
      ws.send("CAP REQ :twitch.tv/tags twitch.tv/commands");
      ws.send("PASS SCHMOOPIIE");
      ws.send("NICK justinfan" + Math.floor(10000 + Math.random() * 80000));
      ws.send("JOIN #" + channel);
    };
    ws.onmessage = function (ev) {
      ev.data.split("\r\n").forEach(function (l) { if (l) handleLine(l); });
    };
    ws.onclose = function () {
      setStatus("off");
      retry++;
      var wait = Math.min(15000, 1000 * retry);
      addSys("Disconnected. Retrying in " + Math.round(wait / 1000) + "s…");
      retryTimer = setTimeout(connect, wait);
    };
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  }

  // reconnect fast when the phone wakes up
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState !== "visible") return;
    keepAwake();
    fetchStats();
    if (!manualOff && platform !== "kick" && (!ws || ws.readyState > 1)) connect();
  });

  // keep the screen on so chat stays visible
  var lock = null;
  function keepAwake() {
    try { if (navigator.wakeLock) navigator.wakeLock.request("screen").then(function (l) { lock = l; }).catch(function () {}); } catch (e) {}
  }
  keepAwake();

  loadGlobalBadges();
  resetStats();
  connect();
})();
</script>
